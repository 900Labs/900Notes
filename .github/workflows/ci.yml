name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Frontend dependency audit
        run: npm audit --audit-level=moderate

      - name: Public release checks
        run: ./scripts/verify-public-release.sh

      - name: i18n coverage
        run: npm run check:i18n

      - name: Frontend type check
        run: npm run check

      - name: Frontend build
        run: npm run build

      - name: Mobile frontend build
        run: npm run build:mobile

      - name: Rust format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        # quick-xml is pulled transitively through plist -> tauri. plist 1.9.0
        # currently pins quick-xml ^0.39.2, so quick-xml >=0.41.0 is not
        # selectable yet. Remove these ignores once the upstream chain moves.
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
