name: Release

# Builds and signs platform installers when a v* tag is pushed, or on demand.
# Signing credentials are read from the `release` environment (Settings >
# Environments > release), never from repository-level secrets. Each build job
# runs in that environment, so the secrets are only injected there and can be
# gated behind a required reviewer. Without credentials the jobs still produce
# unsigned artifacts, identical to the manual release-gate workflow.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build from (defaults to the pushed tag or branch)"
        required: false

permissions:
  contents: write

jobs:
  macos:
    name: macOS bundle
    runs-on: macos-latest
    environment: release
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - run: npm ci
      - run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Clear any stray Apple signing env vars
        run: |
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "$(eval echo \${$var:-})" ]; then
              echo "WARNING: $var is set in the environment; clearing it to prevent codesign import failure"
              echo "$var=" >> "$GITHUB_ENV"
            fi
          done

      - name: macOS Tauri bundle
        run: npm run tauri:build

      - name: Generate DMG checksum
        run: |
          shasum -a 256 src-tauri/target/release/bundle/dmg/*.dmg \
            | tee src-tauri/target/release/bundle/dmg/SHA256SUMS

      - name: Determine artifact label
        id: label
        run: echo "kind=unsigned" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: 900notes-macos-${{ steps.label.outputs.kind }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/SHA256SUMS
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  windows:
    name: Windows bundle
    runs-on: windows-latest
    environment: release
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      HAS_WIN: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Import code signing certificate
        if: ${{ env.HAS_WIN == 'true' }}
        id: cert
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [System.Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}") |
            Set-Content -Path $pfxPath -AsByteStream
          $securePin = ConvertTo-SecureString "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My -Password $securePin
          "thumbprint=$($imported.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Write signing config overlay
        if: ${{ env.HAS_WIN == 'true' }}
        shell: pwsh
        run: |
          $overlay = @{
            bundle = @{
              windows = @{
                certificateThumbprint = "${{ steps.cert.outputs.thumbprint }}"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          }
          $overlay | ConvertTo-Json -Depth 10 |
            Out-File -FilePath src-tauri/tauri.windows-sign.conf.json -Encoding utf8

      - name: Windows Tauri bundle (signed)
        if: ${{ env.HAS_WIN == 'true' }}
        run: npm run tauri:build -- --config src-tauri/tauri.windows-sign.conf.json

      - name: Windows Tauri bundle (unsigned)
        if: ${{ env.HAS_WIN == 'false' }}
        run: npm run tauri:build

      - name: Generate installer checksums
        shell: pwsh
        run: |
          $sums = Join-Path "src-tauri/target/release/bundle/nsis" "SHA256SUMS"
          if (Test-Path "src-tauri/target/release/bundle/nsis/*.exe") {
            Get-FileHash src-tauri/target/release/bundle/nsis/*.exe -Algorithm SHA256 |
              Format-List | Out-File -FilePath $sums -Encoding utf8
          }

      - name: Determine artifact label
        id: label
        shell: bash
        run: |
          if [ "$HAS_WIN" = "true" ]; then echo "kind=signed" >> "$GITHUB_OUTPUT"; else echo "kind=unsigned" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: 900notes-windows-${{ steps.label.outputs.kind }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/SHA256SUMS
            src-tauri/target/release/bundle/nsis/*-setup.nsis.zip
            src-tauri/target/release/bundle/nsis/*-setup.nsis.zip.sig

  linux:
    name: Linux bundle
    runs-on: ubuntu-22.04
    environment: release
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - run: npm ci
      - run: cargo install tauri-cli --version 2.11.4 --locked
      - run: npm run tauri:build

      - name: Generate package checksums
        run: |
          shasum -a 256 \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            | tee src-tauri/target/release/bundle/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: 900notes-linux-unsigned
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
            src-tauri/target/release/bundle/SHA256SUMS

  publish:
    name: Publish release with update manifest
    runs-on: ubuntu-latest
    environment: release
    needs: [macos, windows, linux]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate latest.json update manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! find artifacts -name '*.sig' | grep -q .; then
            echo "No update signatures found (TAURI_SIGNING_PRIVATE_KEY not set); skipping latest.json"
            exit 0
          fi

          VERSION="${TAG#v}"
          MAC_SIG=$(find artifacts -name '*.app.tar.gz.sig' | head -1 | xargs -r cat | head -1)
          WIN_SIG=$(find artifacts -name '*-setup.nsis.zip.sig' | head -1 | xargs -r cat | head -1)
          LINUX_SIG=$(find artifacts -name '*.AppImage.tar.gz.sig' | head -1 | xargs -r cat | head -1)
          REPO="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "900Notes ${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MAC_SIG}",
                "url": "${REPO}/900Notes_${VERSION}_aarch64.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "${REPO}/900Notes_${VERSION}_x64-setup.nsis.zip"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "${REPO}/900Notes_${VERSION}_amd64.AppImage.tar.gz"
              }
            }
          }
          EOF
          cat latest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/SHA256SUMS
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            artifacts/**/*-setup.nsis.zip
            artifacts/**/*-setup.nsis.zip.sig
            artifacts/**/*.AppImage.tar.gz
            artifacts/**/*.AppImage.tar.gz.sig
            latest.json
          generate_release_notes: true
