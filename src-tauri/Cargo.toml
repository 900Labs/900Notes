[package]
name = "notes"
version = "0.1.0"
description = "Knowledge base and note-taking with bidirectional linking. Your second brain, fully owned."
authors = ["900 Labs"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dirs = "6"
printpdf = "0.9"
mdns-sd = "0.18"
automerge = "0.10"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
roxmltree = "0.20"
getrandom = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
