<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 14px;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px;
      color: #60a5fa;
    }
    p {
      margin: 0 0 12px;
      color: #a0a0a0;
      font-size: 13px;
    }
    .setting {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: #888;
    }
    input {
      width: 100%;
      padding: 6px 8px;
      background: #16213e;
      border: 1px solid #30475e;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    .status {
      margin-top: 8px;
      font-size: 12px;
      text-align: center;
    }
    .status.ok { color: #4ade80; }
    .status.err { color: #f87171; }
  </style>
</head>
<body>
  <h1>900Notes Web Clipper</h1>
  <p>Clip web pages and selections directly to your 900Notes knowledge base.</p>

  <div class="setting">
    <label for="port">900Notes Port</label>
    <input type="number" id="port" value="17690" min="1024" max="65535">
  </div>

  <button id="save">Save Settings</button>
  <button id="clip" style="margin-top: 8px;">Clip This Page</button>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
